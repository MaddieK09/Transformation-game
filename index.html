<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformation Game</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="characterCreator" style="display:none;">
    <h1>Create Your Character</h1>

<h2>Identity</h2>

<label>Name</label><br>
<input id="playerName" type="text" placeholder="Enter your name"><br><br>

<label>Age</label><br>
<input id="playerAge" type="number" value="17"><br><br>

<label>Gender Identity</label><br>

<select id="playerGender">
    <option>Male</option>
    <option>Female</option>
    <option>Nonbinary</option>
</select>

<br><br>

<label>Biological Sex</label><br>

<select id="playerSex">
    <option>Male</option>
    <option>Female</option>
    <option>Intersex</option>
</select>

<br><br>

<label>Pronouns</label><br>

<select id="playerPronouns">
    <option>he/him</option>
    <option>she/her</option>
    <option>they/them</option>
</select>

<br><br>
<h2>Appearance</h2>

<label>Height (cm)</label><br>
<input id="playerHeight" type="number" value="175"><br><br>

<label>Weight (kg)</label><br>
<input id="playerWeight" type="number" value="70"><br><br>

<label>Hair Color</label><br>
<input id="playerHairColor" type="text" placeholder="Brown"><br><br>

<label>Eye Color</label><br>
<input id="playerEyeColor" type="text" placeholder="Blue"><br><br>

<label>Species</label><br>
<select id="playerSpecies">
    <option>Human</option>
    <option>Elf</option>
    <option>Demon</option>
    <option>Angel</option>
    <option>Dragon</option>
    <option>Vampire</option>
    <option>Werewolf</option>
</select>

<br><br>
<button id="startAdventure">Start Adventure</button>
</div>
<div id="game">
    <h1>Transformation Game</h1>
    <div id="playerStats"></div>
    <p id="story">
        Welcome! Your adventure will begin here.
    </p>

    <div id="choices">
        <button>Loading...</button>
    </div>
</div>

<script src="script.js?v=2"></script>

</body>
</html>
